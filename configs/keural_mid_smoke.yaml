# Keural Mid-Level Encoder — Smoke test config
#
# Runs 5 steps with synthetic data + distillation disabled.
# Purpose: verify the full forward/backward pass works before committing
# to a long training run.
#
# Usage:
#   cd /home/mkd-s002/vision-encoder/mid
#   python3.10 scripts/smoke_test_mid.py

name: keural-mid-smoke

stem:
  channels: [128, 256, 512, 768]
  kernel_size: 3
  activation: gelu

saliency:
  hidden_channels: 192

tokenizer:
  default_token_budget: 64
  max_token_budget: 128
  budget_split:
    global: 0.05
    region: 0.25
    detail: 0.70
  budget_floors:
    global: 4
    region: 8
    detail: 0
  saliency_smooth_kernel:
    region: 7
    detail: 3
  nms_radius:
    region: 3
    detail: 1
  gumbel_temperature_start: 1.0
  gumbel_temperature_end: 0.05
  temperature_anneal_steps: 50000
  warmup_steps_fixed_grid: 0
  roi_align_size: 4

spatial:
  embed_dim: 768
  depth: 24
  num_heads: 12
  head_dim: 64
  mlp_ratio: 4
  norm_eps: 1.0e-6
  rope_base: 10000.0
  use_pool_token: true

loss:
  primary: sigmoid_siglip
  hct_alpha: 0.5
  saliency_beta: 0.005
  saliency_lambda_smooth: 4.0
  lambda_hct: 1.0
  lambda_sal: 0.5
  lambda_distill: 0.5
  learnable_temperature_init: 2.30
  learnable_bias_init: -10.0

distillation:
  enabled: false
  siglip_model: google/siglip-so400m-patch14-384
  siglip_embed_dim: 1152
  internvit_model: OpenGVLab/InternViT-300M-448px
  internvit_embed_dim: 768
  lambda_siglip: 0.5
  lambda_internvit: 0.5

training:
  precision: bfloat16
  gradient_checkpointing: true
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.05
  lr: 5.0e-4
  lr_schedule: cosine_with_warmup
  warmup_steps: 2
  max_steps: 5
  batch_size_per_device: 4
  gradient_accumulation: 1
  log_every: 1
  save_every: 10
  seed: 42

data:
  dataset_name: cc3m
  images_root: ../poc/data/cc3m
  captions_path: ../poc/data/indexes/cc3m_wds_train.tsv
  image_buckets:
    - [224, 224]
    - [384, 384]
  pixel_mean: [0.485, 0.456, 0.406]
  pixel_std: [0.229, 0.224, 0.225]
  max_caption_length: 77
  num_workers: 0
  text_encoder_name: openai/clip-vit-large-patch14
