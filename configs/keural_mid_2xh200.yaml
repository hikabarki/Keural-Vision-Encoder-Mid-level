# Keural Mid-Level Encoder — 2× H200 141GB config
#
# H200 has 141GB HBM3e VRAM (vs 80GB on H100) — 1.76× more memory.
# This allows batch_size_per_device=256 (vs 128 on H100 80GB).
#
# Effective batch = 256 (per GPU) × 4 (accum) × 2 (GPUs) = 2048
# Same effective batch as 4×H100 config — identical training dynamics.
#
# H200 advantages over H100:
#   - 141GB HBM3e: 1.76× memory → larger per-GPU batch
#   - 4.8 TB/s bandwidth (vs 3.35 TB/s H100): ~1.4× faster memory ops
#   - Same SM 9.0 architecture: flash-attn, bfloat16, NCCL all compatible
#
# Estimated: ~500K steps ≈ 7-8 days on 2× H200
#   (vs 8-10 days on 2×H100, 4-5 days on 4×H100)

name: keural-mid

stem:
  channels: [128, 256, 512, 768]
  kernel_size: 3
  activation: gelu

saliency:
  hidden_channels: 192

tokenizer:
  default_token_budget: 512
  max_token_budget: 2048
  budget_split:
    global: 0.05
    region: 0.25
    detail: 0.70
  budget_floors:
    global: 8
    region: 16
    detail: 0
  saliency_smooth_kernel:
    region: 7
    detail: 3
  nms_radius:
    region: 3
    detail: 1
  gumbel_temperature_start: 1.0
  gumbel_temperature_end: 0.05
  # NOTE: all *_steps below are OPTIMIZER steps (one per gradient_accumulation
  # micro-batches), matching training.max_steps. Sized so the anneal completes
  # well before training ends: fixed-grid for steps 0-4000, then Gumbel anneal
  # 4000->14000, then fully sharp (0.05) for the final ~4000 steps.
  temperature_anneal_steps: 10000
  warmup_steps_fixed_grid: 4000

spatial:
  embed_dim: 768
  depth: 24
  num_heads: 12
  head_dim: 64
  mlp_ratio: 4
  norm_eps: 1.0e-6
  rope_base: 10000.0

loss:
  primary: sigmoid_siglip
  saliency_beta: 0.005
  saliency_lambda_smooth: 4.0
  lambda_hct: 1.0
  lambda_sal: 0.5
  lambda_distill: 0.5
  learnable_temperature_init: 2.30
  learnable_bias_init: -10.0

distillation:
  enabled: true
  siglip_model: google/siglip-so400m-patch14-384
  siglip_embed_dim: 1152
  internvit_model: OpenGVLab/InternViT-300M-448px
  internvit_embed_dim: 1024
  lambda_siglip: 0.5
  lambda_internvit: 0.5

training:
  precision: bfloat16
  gradient_checkpointing: true    # enable to reduce VRAM (teachers use ~35GB)
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.05
  lr: 5.0e-4
  lr_schedule: cosine_with_warmup
  warmup_steps: 2000
  max_steps: 18000                # 20M pairs × 2 epochs / 2304 eff_batch ≈ 17,361 steps
  batch_size_per_device: 768      # 768 × 2 accum × 2 GPUs = 3072 effective (~120GB/GPU on H200 140GB)
  gradient_accumulation: 2        # maximize GPU utilization
  log_every: 100
  save_every: 1000                # checkpoint every 1K steps, no auto-delete
  seed: 42

data:
  dataset_name: cc3m
  images_root: /home/work/keural-model/vision-encoder-dataset/datacomp_medium
  captions_path: /home/work/keural-model/vision-encoder-dataset/indexes/datacomp_train.tsv
  extra_sources: []
  # Stage 2: uncomment below and change dataset_name to datacomp+coyo after COYO index is ready
  # extra_sources:
  #   - images_root: /home/work/keural-model/vision-encoder-dataset/coyo_filtered
  #     captions_path: /home/work/keural-model/vision-encoder-dataset/indexes/coyo_train.tsv
  image_buckets:
    - [384, 384]   # SigLIP teacher native res
    - [448, 448]   # InternViT-300M teacher native res
  pixel_mean: [0.485, 0.456, 0.406]
  pixel_std: [0.229, 0.224, 0.225]
  max_caption_length: 77
  num_workers: 12
  text_encoder_name: openai/clip-vit-large-patch14
